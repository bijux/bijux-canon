components:
  schemas:
    AnswerPolicy:
      additionalProperties: false
      description: Grounding and publication requirements.
      properties:
        permit_insufficient_answer:
          default: true
          title: Permit Insufficient Answer
          type: boolean
        provider:
          minLength: 1
          title: Provider
          type: string
        publish:
          default: true
          title: Publish
          type: boolean
        require_citations:
          default: true
          title: Require Citations
          type: boolean
      required:
      - provider
      title: AnswerPolicy
      type: object
    AskRequest:
      additionalProperties: false
      description: Produce a grounded answer from retrieved evidence.
      properties:
        answer_policy:
          $ref: '#/components/schemas/AnswerPolicy'
        budget:
          $ref: '#/components/schemas/Budget'
        context:
          $ref: '#/components/schemas/RequestContext'
        corpus_id:
          pattern: ^sha256:[0-9a-f]{64}$
          title: Corpus Id
          type: string
        execution_profile:
          enum:
          - offline-lexical
          - local-hybrid-exact
          - local-hybrid-ann
          - qdrant-hybrid
          title: Execution Profile
          type: string
        filters:
          $ref: '#/components/schemas/Filters'
          default:
            document_ids: []
            source_uris: []
        index_id:
          pattern: ^sha256:[0-9a-f]{64}$
          title: Index Id
          type: string
        query:
          maxLength: 32768
          minLength: 1
          title: Query
          type: string
        scope:
          minLength: 1
          title: Scope
          type: string
        top_k:
          maximum: 1000.0
          minimum: 1.0
          title: Top K
          type: integer
      required:
      - context
      - query
      - index_id
      - scope
      - top_k
      - budget
      - execution_profile
      - corpus_id
      - answer_policy
      title: AskRequest
      type: object
    Budget:
      additionalProperties: false
      description: Hard execution and persistence bounds.
      properties:
        max_artifact_bytes:
          minimum: 1.0
          title: Max Artifact Bytes
          type: integer
        max_provider_tokens:
          anyOf:
          - minimum: 1.0
            type: integer
          - type: 'null'
          title: Max Provider Tokens
        max_steps:
          anyOf:
          - minimum: 1.0
            type: integer
          - type: 'null'
          title: Max Steps
        timeout_seconds:
          exclusiveMinimum: 0.0
          title: Timeout Seconds
          type: number
      required:
      - timeout_seconds
      - max_artifact_bytes
      title: Budget
      type: object
    BuildIndexRequest:
      additionalProperties: false
      description: Build immutable indexes for one corpus artifact.
      properties:
        budget:
          $ref: '#/components/schemas/Budget'
        context:
          $ref: '#/components/schemas/RequestContext'
        corpus_id:
          pattern: ^sha256:[0-9a-f]{64}$
          title: Corpus Id
          type: string
        execution_profile:
          enum:
          - offline-lexical
          - local-hybrid-exact
          - local-hybrid-ann
          - qdrant-hybrid
          title: Execution Profile
          type: string
        scope:
          minLength: 1
          title: Scope
          type: string
      required:
      - context
      - corpus_id
      - scope
      - budget
      - execution_profile
      title: BuildIndexRequest
      type: object
    CancelRequest:
      additionalProperties: false
      description: Auditable caller reason for cooperative cancellation.
      properties:
        context:
          $ref: '#/components/schemas/RequestContext'
        reason:
          maxLength: 1000
          minLength: 1
          title: Reason
          type: string
      required:
      - context
      - reason
      title: CancelRequest
      type: object
    CompareRequest:
      additionalProperties: false
      description: Compare two explicit immutable attempts.
      properties:
        baseline_attempt_id:
          maxLength: 200
          minLength: 1
          title: Baseline Attempt Id
          type: string
        baseline_run_id:
          maxLength: 200
          minLength: 1
          title: Baseline Run Id
          type: string
        candidate_attempt_id:
          maxLength: 200
          minLength: 1
          title: Candidate Attempt Id
          type: string
        candidate_run_id:
          maxLength: 200
          minLength: 1
          title: Candidate Run Id
          type: string
        context:
          $ref: '#/components/schemas/RequestContext'
        cursor:
          anyOf:
          - maxLength: 4096
            minLength: 1
            type: string
          - type: 'null'
          title: Cursor
        dimensions:
          items:
            enum:
            - dag
            - configuration
            - corpus
            - index
            - model
            - retrieval
            - claims
            - citations
            - provider-calls
            - timing
            - policy
            - outcome
            type: string
          maxItems: 12
          minItems: 1
          title: Dimensions
          type: array
        limit:
          default: 100
          maximum: 1000.0
          minimum: 1.0
          title: Limit
          type: integer
      required:
      - context
      - baseline_run_id
      - baseline_attempt_id
      - candidate_run_id
      - candidate_attempt_id
      - dimensions
      title: CompareRequest
      type: object
    CorpusInspectionResponse:
      additionalProperties: false
      description: Verified immutable corpus publication metadata.
      properties:
        byte_length:
          minimum: 1.0
          title: Byte Length
          type: integer
        canonical_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Canonical Sha256
          type: string
        generation_name:
          pattern: ^[0-9a-f]{64}$
          title: Generation Name
          type: string
        schema_version:
          const: bijux.canon.ingest.corpus_publication.v1
          title: Schema Version
          type: string
        snapshot_id:
          pattern: ^sha256:[0-9a-f]{64}$
          title: Snapshot Id
          type: string
      required:
      - schema_version
      - snapshot_id
      - canonical_sha256
      - byte_length
      - generation_name
      title: CorpusInspectionResponse
      type: object
    CursorPageResponse:
      additionalProperties: false
      description: Stable page metadata bound to one immutable response snapshot.
      properties:
        limit:
          maximum: 1000.0
          minimum: 1.0
          title: Limit
          type: integer
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
        next_offset:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Next Offset
        offset:
          minimum: 0.0
          title: Offset
          type: integer
        snapshot_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Snapshot Sha256
          type: string
      required:
      - limit
      - next_cursor
      - next_offset
      - offset
      - snapshot_sha256
      title: CursorPageResponse
      type: object
    ExecutionProfile:
      description: Supported local and service-backed execution profiles.
      enum:
      - offline-lexical
      - local-hybrid-exact
      - local-hybrid-ann
      - qdrant-hybrid
      title: ExecutionProfile
      type: string
    Filters:
      additionalProperties: false
      description: Immutable retrieval filters.
      properties:
        document_ids:
          default: []
          items:
            type: string
          maxItems: 1000
          title: Document Ids
          type: array
        source_uris:
          default: []
          items:
            type: string
          maxItems: 1000
          title: Source Uris
          type: array
      title: Filters
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    IndexDiscoveryResponse:
      additionalProperties: false
      description: Content-safe active index identity.
      properties:
        chunk_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Chunk Count
        chunk_set_sha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Chunk Set Sha256
        dimension:
          anyOf:
          - type: integer
          - type: 'null'
          title: Dimension
        generation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Generation Id
        model_lock_artifact_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Lock Artifact Id
        snapshot_artifact_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Snapshot Artifact Id
        status:
          enum:
          - not_configured
          - unavailable
          - active
          title: Status
          type: string
      required:
      - status
      - generation_id
      - snapshot_artifact_id
      - model_lock_artifact_id
      - chunk_set_sha256
      - chunk_count
      - dimension
      title: IndexDiscoveryResponse
      type: object
    IndexInspectionResponse:
      additionalProperties: false
      description: Content-safe immutable index generation metadata.
      properties:
        activation:
          additionalProperties: true
          title: Activation
          type: object
        chunk_count:
          minimum: 1.0
          title: Chunk Count
          type: integer
        chunk_set_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Chunk Set Sha256
          type: string
        compatibility:
          additionalProperties: true
          title: Compatibility
          type: object
        dimension:
          minimum: 1.0
          title: Dimension
          type: integer
        filters:
          additionalProperties: true
          title: Filters
          type: object
        generation_id:
          pattern: ^sha256:[0-9a-f]{64}$
          title: Generation Id
          type: string
        integrity:
          additionalProperties: true
          title: Integrity
          type: object
        lineage:
          additionalProperties: true
          title: Lineage
          type: object
        metadata_bytes:
          minimum: 0.0
          title: Metadata Bytes
          type: integer
        model_lock_artifact_id:
          maxLength: 200
          minLength: 1
          title: Model Lock Artifact Id
          type: string
        page:
          $ref: '#/components/schemas/CursorPageResponse'
        schema_version:
          const: bijux.canon.index.inspection.v1
          title: Schema Version
          type: string
        segments:
          items:
            additionalProperties: true
            type: object
          title: Segments
          type: array
        snapshot_artifact_id:
          maxLength: 200
          minLength: 1
          title: Snapshot Artifact Id
          type: string
        text_bytes:
          minimum: 0.0
          title: Text Bytes
          type: integer
        vector_bytes:
          minimum: 0.0
          title: Vector Bytes
          type: integer
      required:
      - schema_version
      - generation_id
      - snapshot_artifact_id
      - model_lock_artifact_id
      - chunk_set_sha256
      - chunk_count
      - dimension
      - text_bytes
      - vector_bytes
      - metadata_bytes
      - segments
      - filters
      - lineage
      - integrity
      - activation
      - compatibility
      - page
      title: IndexInspectionResponse
      type: object
    InstalledDistributionDiscoveryResponse:
      additionalProperties: false
      description: Exact installed version of one canonical package.
      properties:
        name:
          title: Name
          type: string
        version:
          title: Version
          type: string
      required:
      - name
      - version
      title: InstalledDistributionDiscoveryResponse
      type: object
    JobResultResponse:
      additionalProperties: false
      description: Typed successful result returned by the application executor.
      properties:
        job_id:
          title: Job Id
          type: string
        result:
          additionalProperties: true
          title: Result
          type: object
        schema_version:
          const: bijux.runtime.http-job-result.v2
          title: Schema Version
          type: string
      required:
      - schema_version
      - job_id
      - result
      title: JobResultResponse
      type: object
    JobStatusResponse:
      additionalProperties: false
      description: Restart-safe durable job state.
      properties:
        attempt_count:
          title: Attempt Count
          type: integer
        cancel_requested:
          title: Cancel Requested
          type: boolean
        cancellation_uri:
          title: Cancellation Uri
          type: string
        deadline_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Deadline At
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
        error_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Type
        finished_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Finished At
        job_id:
          title: Job Id
          type: string
        kind:
          enum:
          - run
          - replay
          title: Kind
          type: string
        result_available:
          title: Result Available
          type: boolean
        result_uri:
          title: Result Uri
          type: string
        schema_version:
          const: bijux.runtime.http-job-status.v2
          title: Schema Version
          type: string
        started_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Started At
        status:
          enum:
          - queued
          - running
          - succeeded
          - failed
          - cancelled
          - timed_out
          title: Status
          type: string
        status_uri:
          title: Status Uri
          type: string
        submitted_at:
          title: Submitted At
          type: string
        timeout_seconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Timeout Seconds
      required:
      - schema_version
      - job_id
      - kind
      - status
      - cancel_requested
      - attempt_count
      - submitted_at
      - started_at
      - finished_at
      - deadline_at
      - timeout_seconds
      - result_available
      - error_type
      - error_message
      - status_uri
      - result_uri
      - cancellation_uri
      title: JobStatusResponse
      type: object
    LivenessResponse:
      additionalProperties: false
      description: Dependency-free process liveness.
      properties:
        live:
          const: true
          title: Live
          type: boolean
        schema_version:
          const: bijux.runtime.liveness.v1
          title: Schema Version
          type: string
        status:
          const: ok
          title: Status
          type: string
      required:
      - schema_version
      - live
      - status
      title: LivenessResponse
      type: object
    ModelDiscoveryResponse:
      additionalProperties: false
      description: Content-safe effective embedding-model identity.
      properties:
        artifact_set_digest:
          anyOf:
          - type: string
          - type: 'null'
          title: Artifact Set Digest
        compatibility_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Compatibility Status
        dimension:
          anyOf:
          - type: integer
          - type: 'null'
          title: Dimension
        license_pointer:
          anyOf:
          - type: string
          - type: 'null'
          title: License Pointer
        model_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Id
        model_lock_artifact_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Lock Artifact Id
        offline_reuse:
          title: Offline Reuse
          type: boolean
        profile_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Profile Id
        provider_kind:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider Kind
        revision:
          anyOf:
          - type: string
          - type: 'null'
          title: Revision
        status:
          enum:
          - not_configured
          - unavailable
          - verified
          title: Status
          type: string
        validation_record_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Validation Record Id
        validation_result:
          anyOf:
          - type: string
          - type: 'null'
          title: Validation Result
      required:
      - status
      - model_lock_artifact_id
      - profile_id
      - provider_kind
      - model_id
      - revision
      - dimension
      - validation_record_id
      - artifact_set_digest
      - license_pointer
      - compatibility_status
      - validation_result
      - offline_reuse
      title: ModelDiscoveryResponse
      type: object
    ParserDiscoveryResponse:
      additionalProperties: false
      description: One source format and its installed admission disposition.
      properties:
        disposition:
          enum:
          - supported
          - typed_refusal
          title: Disposition
          type: string
        format_id:
          enum:
          - jats
          - pdf-digital
          - html
          - markdown
          - text
          - docx
          - ocr-required
          title: Format Id
          type: string
      required:
      - format_id
      - disposition
      title: ParserDiscoveryResponse
      type: object
    PrepareCorpusRequest:
      additionalProperties: false
      description: Prepare a corpus from one explicit local directory.
      properties:
        budget:
          $ref: '#/components/schemas/Budget'
        context:
          $ref: '#/components/schemas/RequestContext'
        execution_profile:
          default: local-hybrid-exact
          enum:
          - offline-lexical
          - local-hybrid-exact
          - local-hybrid-ann
          - qdrant-hybrid
          title: Execution Profile
          type: string
        scope:
          minLength: 1
          title: Scope
          type: string
        source_directory:
          minLength: 1
          title: Source Directory
          type: string
      required:
      - context
      - source_directory
      - scope
      - budget
      title: PrepareCorpusRequest
      type: object
    ProblemDetail:
      additionalProperties: false
      description: Safe RFC 9457-style failure shared by every v2 route.
      properties:
        cause:
          anyOf:
          - type: string
          - type: 'null'
          title: Cause
        code:
          $ref: '#/components/schemas/RuntimeProblemCode'
        correlation_id:
          title: Correlation Id
          type: string
        remediation:
          title: Remediation
          type: string
        retryable:
          title: Retryable
          type: boolean
        run_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Run Id
        schema_version:
          const: bijux.runtime.problem.v2
          title: Schema Version
          type: string
        status:
          title: Status
          type: integer
        title:
          title: Title
          type: string
        type:
          title: Type
          type: string
      required:
      - schema_version
      - type
      - title
      - status
      - code
      - correlation_id
      - run_id
      - retryable
      - remediation
      - cause
      title: ProblemDetail
      type: object
    ProviderDiscoveryResponse:
      additionalProperties: false
      description: One provider identifier accepted by installed reasoning.
      properties:
        credential_required:
          const: false
          title: Credential Required
          type: boolean
        provider_id:
          enum:
          - credential-free
          - local-recorded
          title: Provider Id
          type: string
        provider_kind:
          const: local
          title: Provider Kind
          type: string
      required:
      - provider_id
      - provider_kind
      - credential_required
      title: ProviderDiscoveryResponse
      type: object
    QueryStageDiagnosticsResponse:
      additionalProperties: false
      description: Per-question stage population and qrel losses.
      properties:
        dense_observed_count:
          minimum: 0.0
          title: Dense Observed Count
          type: integer
        final_count:
          minimum: 0.0
          title: Final Count
          type: integer
        fusion_count:
          minimum: 0.0
          title: Fusion Count
          type: integer
        lexical_included_count:
          minimum: 0.0
          title: Lexical Included Count
          type: integer
        lexical_observed_count:
          minimum: 0.0
          title: Lexical Observed Count
          type: integer
        query_id:
          minLength: 1
          title: Query Id
          type: string
        relevant_evidence:
          items:
            $ref: '#/components/schemas/RelevantEvidenceStageTraceResponse'
          minItems: 1
          title: Relevant Evidence
          type: array
        rerank_count:
          minimum: 0.0
          title: Rerank Count
          type: integer
      required:
      - query_id
      - lexical_observed_count
      - lexical_included_count
      - dense_observed_count
      - fusion_count
      - rerank_count
      - final_count
      - relevant_evidence
      title: QueryStageDiagnosticsResponse
      type: object
    ReadinessCapability:
      description: Public capability whose exact dependencies are being checked.
      enum:
      - initialized
      - ingest
      - index
      - retrieve
      - ask
      - research
      - run
      title: ReadinessCapability
      type: string
    ReadinessCheckResponse:
      additionalProperties: false
      description: One safe typed dependency verdict.
      properties:
        name:
          enum:
          - workspace-initialization
          - schema-migrations
          - artifact-store
          - active-generation
          - model-configuration
          - provider-configuration
          - writable-state
          title: Name
          type: string
        ready:
          title: Ready
          type: boolean
        reason:
          anyOf:
          - enum:
            - workspace-not-configured
            - workspace-invalid
            - database-not-configured
            - schema-unavailable
            - artifact-store-not-configured
            - artifact-store-unavailable
            - index-not-configured
            - active-generation-unavailable
            - model-configuration-unavailable
            - provider-configuration-unavailable
            - state-not-writable
            type: string
          - type: 'null'
          title: Reason
        remediation:
          anyOf:
          - type: string
          - type: 'null'
          title: Remediation
      required:
      - name
      - ready
      - reason
      - remediation
      title: ReadinessCheckResponse
      type: object
    ReadinessResponse:
      additionalProperties: false
      description: Conjunctive deep readiness with typed degraded reasons.
      properties:
        capability:
          enum:
          - initialized
          - ingest
          - index
          - retrieve
          - ask
          - research
          - run
          title: Capability
          type: string
        checks:
          items:
            $ref: '#/components/schemas/ReadinessCheckResponse'
          title: Checks
          type: array
        ready:
          title: Ready
          type: boolean
        reasons:
          items:
            enum:
            - workspace-not-configured
            - workspace-invalid
            - database-not-configured
            - schema-unavailable
            - artifact-store-not-configured
            - artifact-store-unavailable
            - index-not-configured
            - active-generation-unavailable
            - model-configuration-unavailable
            - provider-configuration-unavailable
            - state-not-writable
            type: string
          title: Reasons
          type: array
        schema_version:
          const: bijux.runtime.readiness.v2
          title: Schema Version
          type: string
        status:
          enum:
          - ready
          - degraded
          title: Status
          type: string
      required:
      - schema_version
      - capability
      - ready
      - status
      - checks
      - reasons
      title: ReadinessResponse
      type: object
    RelevantEvidenceStageTraceResponse:
      additionalProperties: false
      description: Ranks and first accountable loss point for one reviewed qrel.
      properties:
        chunk_id:
          minLength: 1
          title: Chunk Id
          type: string
        dense_rank:
          anyOf:
          - minimum: 1.0
            type: integer
          - type: 'null'
          title: Dense Rank
        disposition:
          enum:
          - retained_at_5
          - final_below_5
          - absent_from_candidate_depth
          - excluded_by_channel_limit
          - lost_at_fusion_limit
          - lost_at_rerank_limit
          - lost_at_finalization
          - execution_refused
          - execution_failed
          title: Disposition
          type: string
        final_rank:
          anyOf:
          - minimum: 1.0
            type: integer
          - type: 'null'
          title: Final Rank
        fusion_rank:
          anyOf:
          - minimum: 1.0
            type: integer
          - type: 'null'
          title: Fusion Rank
        lexical_disposition:
          anyOf:
          - type: string
          - type: 'null'
          title: Lexical Disposition
        lexical_output_rank:
          anyOf:
          - minimum: 1.0
            type: integer
          - type: 'null'
          title: Lexical Output Rank
        lexical_source_rank:
          anyOf:
          - minimum: 1.0
            type: integer
          - type: 'null'
          title: Lexical Source Rank
        qrel_id:
          minLength: 1
          title: Qrel Id
          type: string
        relevance_grade:
          maximum: 3.0
          minimum: 0.0
          title: Relevance Grade
          type: integer
        rerank_rank:
          anyOf:
          - minimum: 1.0
            type: integer
          - type: 'null'
          title: Rerank Rank
      required:
      - qrel_id
      - chunk_id
      - relevance_grade
      - lexical_source_rank
      - lexical_output_rank
      - lexical_disposition
      - dense_rank
      - fusion_rank
      - rerank_rank
      - final_rank
      - disposition
      title: RelevantEvidenceStageTraceResponse
      type: object
    ReplayRequest:
      additionalProperties: false
      description: Create a replay from one immutable source attempt.
      properties:
        context:
          $ref: '#/components/schemas/RequestContext'
        network_policy:
          enum:
          - disabled
          - recorded-only
          - permitted
          title: Network Policy
          type: string
