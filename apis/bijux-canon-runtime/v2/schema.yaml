components:
  schemas:
    AnswerPolicy:
      additionalProperties: false
      description: Grounding and publication requirements.
      properties:
        permit_insufficient_answer:
          default: true
          title: Permit Insufficient Answer
          type: boolean
        provider:
          minLength: 1
          title: Provider
          type: string
        publish:
          default: true
          title: Publish
          type: boolean
        require_citations:
          default: true
          title: Require Citations
          type: boolean
      required:
      - provider
      title: AnswerPolicy
      type: object
    AskRequest:
      additionalProperties: false
      description: Produce a grounded answer from retrieved evidence.
      properties:
        answer_policy:
          $ref: '#/components/schemas/AnswerPolicy'
        budget:
          $ref: '#/components/schemas/Budget'
        context:
          $ref: '#/components/schemas/RequestContext'
        corpus_id:
          pattern: ^sha256:[0-9a-f]{64}$
          title: Corpus Id
          type: string
        execution_profile:
          enum:
          - offline-lexical
          - local-hybrid-exact
          - local-hybrid-ann
          - qdrant-hybrid
          title: Execution Profile
          type: string
        filters:
          $ref: '#/components/schemas/Filters'
          default:
            document_ids: []
            source_uris: []
        index_id:
          pattern: ^sha256:[0-9a-f]{64}$
          title: Index Id
          type: string
        query:
          maxLength: 32768
          minLength: 1
          title: Query
          type: string
        scope:
          minLength: 1
          title: Scope
          type: string
        top_k:
          maximum: 1000.0
          minimum: 1.0
          title: Top K
          type: integer
      required:
      - context
      - query
      - index_id
      - scope
      - top_k
      - budget
      - execution_profile
      - corpus_id
      - answer_policy
      title: AskRequest
      type: object
    Budget:
      additionalProperties: false
      description: Hard execution and persistence bounds.
      properties:
        max_artifact_bytes:
          minimum: 1.0
          title: Max Artifact Bytes
          type: integer
        max_provider_tokens:
          anyOf:
          - minimum: 1.0
            type: integer
          - type: 'null'
          title: Max Provider Tokens
        max_steps:
          anyOf:
          - minimum: 1.0
            type: integer
          - type: 'null'
          title: Max Steps
        timeout_seconds:
          exclusiveMinimum: 0.0
          title: Timeout Seconds
          type: number
      required:
      - timeout_seconds
      - max_artifact_bytes
      title: Budget
      type: object
    BuildIndexRequest:
      additionalProperties: false
      description: Build immutable indexes for one corpus artifact.
      properties:
        budget:
          $ref: '#/components/schemas/Budget'
        context:
          $ref: '#/components/schemas/RequestContext'
        corpus_id:
          pattern: ^sha256:[0-9a-f]{64}$
          title: Corpus Id
          type: string
        execution_profile:
          enum:
          - offline-lexical
          - local-hybrid-exact
          - local-hybrid-ann
          - qdrant-hybrid
          title: Execution Profile
          type: string
        scope:
          minLength: 1
          title: Scope
          type: string
      required:
      - context
      - corpus_id
      - scope
      - budget
      - execution_profile
      title: BuildIndexRequest
      type: object
    CancelRequest:
      additionalProperties: false
      description: Auditable caller reason for cooperative cancellation.
      properties:
        context:
          $ref: '#/components/schemas/RequestContext'
        reason:
          maxLength: 1000
          minLength: 1
          title: Reason
          type: string
      required:
      - context
      - reason
      title: CancelRequest
      type: object
    CompareRequest:
      additionalProperties: false
      description: Compare two explicit immutable attempts.
      properties:
        baseline_attempt_id:
          maxLength: 200
          minLength: 1
          title: Baseline Attempt Id
          type: string
        baseline_run_id:
          maxLength: 200
          minLength: 1
          title: Baseline Run Id
          type: string
        candidate_attempt_id:
          maxLength: 200
          minLength: 1
          title: Candidate Attempt Id
          type: string
        candidate_run_id:
          maxLength: 200
          minLength: 1
          title: Candidate Run Id
          type: string
        context:
          $ref: '#/components/schemas/RequestContext'
        dimensions:
          items:
            enum:
            - dag
            - configuration
            - corpus
            - index
            - model
            - retrieval
            - claims
            - citations
            - provider-calls
            - timing
            - policy
            - outcome
            type: string
          title: Dimensions
          type: array
      required:
      - context
      - baseline_run_id
      - baseline_attempt_id
      - candidate_run_id
      - candidate_attempt_id
      - dimensions
      title: CompareRequest
      type: object
    CorpusInspectionResponse:
      additionalProperties: false
      description: Verified immutable corpus publication metadata.
      properties:
        byte_length:
          minimum: 1.0
          title: Byte Length
          type: integer
        canonical_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Canonical Sha256
          type: string
        generation_name:
          pattern: ^[0-9a-f]{64}$
          title: Generation Name
          type: string
        schema_version:
          const: bijux.canon.ingest.corpus_publication.v1
          title: Schema Version
          type: string
        snapshot_id:
          pattern: ^sha256:[0-9a-f]{64}$
          title: Snapshot Id
          type: string
      required:
      - schema_version
      - snapshot_id
      - canonical_sha256
      - byte_length
      - generation_name
      title: CorpusInspectionResponse
      type: object
    Filters:
      additionalProperties: false
      description: Immutable retrieval filters.
      properties:
        document_ids:
          default: []
          items:
            type: string
          title: Document Ids
          type: array
        source_uris:
          default: []
          items:
            type: string
          title: Source Uris
          type: array
      title: Filters
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    IndexInspectionResponse:
      additionalProperties: false
      description: Content-safe immutable index generation metadata.
      properties:
        activation:
          additionalProperties: true
          title: Activation
          type: object
        chunk_count:
          minimum: 1.0
          title: Chunk Count
          type: integer
        chunk_set_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Chunk Set Sha256
          type: string
        compatibility:
          additionalProperties: true
          title: Compatibility
          type: object
        dimension:
          minimum: 1.0
          title: Dimension
          type: integer
        filters:
          additionalProperties: true
          title: Filters
          type: object
        generation_id:
          pattern: ^sha256:[0-9a-f]{64}$
          title: Generation Id
          type: string
        integrity:
          additionalProperties: true
          title: Integrity
          type: object
        lineage:
          additionalProperties: true
          title: Lineage
          type: object
        metadata_bytes:
          minimum: 0.0
          title: Metadata Bytes
          type: integer
        model_lock_artifact_id:
          pattern: ^sha256:[0-9a-f]{64}$
          title: Model Lock Artifact Id
          type: string
        schema_version:
          const: bijux.canon.index.inspection.v1
          title: Schema Version
          type: string
        segments:
          items:
            additionalProperties: true
            type: object
          title: Segments
          type: array
        snapshot_artifact_id:
          pattern: ^sha256:[0-9a-f]{64}$
          title: Snapshot Artifact Id
          type: string
        text_bytes:
          minimum: 0.0
          title: Text Bytes
          type: integer
        vector_bytes:
          minimum: 0.0
          title: Vector Bytes
          type: integer
      required:
      - schema_version
      - generation_id
      - snapshot_artifact_id
      - model_lock_artifact_id
      - chunk_set_sha256
      - chunk_count
      - dimension
      - text_bytes
      - vector_bytes
      - metadata_bytes
      - segments
      - filters
      - lineage
      - integrity
      - activation
      - compatibility
      title: IndexInspectionResponse
      type: object
    JobResultResponse:
      additionalProperties: false
      description: Typed successful result returned by the application executor.
      properties:
        job_id:
          title: Job Id
          type: string
        result:
          additionalProperties: true
          title: Result
          type: object
        schema_version:
          const: bijux.runtime.http-job-result.v2
          title: Schema Version
          type: string
      required:
      - schema_version
      - job_id
      - result
      title: JobResultResponse
      type: object
    JobStatusResponse:
      additionalProperties: false
      description: Restart-safe durable job state.
      properties:
        attempt_count:
          title: Attempt Count
          type: integer
        cancel_requested:
          title: Cancel Requested
          type: boolean
        cancellation_uri:
          title: Cancellation Uri
          type: string
        deadline_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Deadline At
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
        error_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Type
        finished_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Finished At
        job_id:
          title: Job Id
          type: string
        kind:
          enum:
          - run
          - replay
          title: Kind
          type: string
        result_available:
          title: Result Available
          type: boolean
        result_uri:
          title: Result Uri
          type: string
        schema_version:
          const: bijux.runtime.http-job-status.v2
          title: Schema Version
          type: string
        started_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Started At
        status:
          enum:
          - queued
          - running
          - succeeded
          - failed
          - cancelled
          - timed_out
          title: Status
          type: string
        status_uri:
          title: Status Uri
          type: string
        submitted_at:
          title: Submitted At
          type: string
        timeout_seconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Timeout Seconds
      required:
      - schema_version
      - job_id
      - kind
      - status
      - cancel_requested
      - attempt_count
      - submitted_at
      - started_at
      - finished_at
      - deadline_at
      - timeout_seconds
      - result_available
      - error_type
      - error_message
      - status_uri
      - result_uri
      - cancellation_uri
      title: JobStatusResponse
      type: object
    PrepareCorpusRequest:
      additionalProperties: false
      description: Prepare a corpus from one explicit local directory.
      properties:
        budget:
          $ref: '#/components/schemas/Budget'
        context:
          $ref: '#/components/schemas/RequestContext'
        execution_profile:
          default: local-hybrid-exact
          enum:
          - offline-lexical
          - local-hybrid-exact
          - local-hybrid-ann
          - qdrant-hybrid
          title: Execution Profile
          type: string
        scope:
          minLength: 1
          title: Scope
          type: string
        source_directory:
          minLength: 1
          title: Source Directory
          type: string
      required:
      - context
      - source_directory
      - scope
      - budget
      title: PrepareCorpusRequest
      type: object
    ProblemDetail:
      additionalProperties: false
      description: Safe RFC 9457-style failure shared by every v2 route.
      properties:
        cause:
          anyOf:
          - type: string
          - type: 'null'
          title: Cause
        code:
          title: Code
          type: string
        correlation_id:
          title: Correlation Id
          type: string
        remediation:
          title: Remediation
          type: string
        retryable:
          title: Retryable
          type: boolean
        status:
          title: Status
          type: integer
        title:
          title: Title
          type: string
        type:
          title: Type
          type: string
      required:
      - type
      - title
      - status
      - code
      - correlation_id
      - retryable
      - remediation
      title: ProblemDetail
      type: object
    ReplayRequest:
      additionalProperties: false
      description: Create a replay from one immutable source attempt.
      properties:
        context:
          $ref: '#/components/schemas/RequestContext'
        network_policy:
          enum:
          - disabled
          - recorded-only
          - permitted
          title: Network Policy
          type: string
        process_id:
          maxLength: 200
          minLength: 1
          title: Process Id
          type: string
        provider_allowlist:
          default: []
          items:
            type: string
          title: Provider Allowlist
          type: array
        source_attempt_id:
          maxLength: 200
          minLength: 1
          title: Source Attempt Id
          type: string
        timeout_seconds:
          anyOf:
          - exclusiveMinimum: 0.0
            type: number
          - type: 'null'
          title: Timeout Seconds
      required:
      - context
      - source_attempt_id
      - process_id
      - network_policy
      title: ReplayRequest
      type: object
    RequestContext:
      additionalProperties: false
      description: Versioned caller and correlation identity.
      properties:
        contract_version:
          const: v2
          title: Contract Version
          type: string
        correlation_id:
          maxLength: 200
          minLength: 1
          title: Correlation Id
          type: string
        replay_mode:
          default: strict
          enum:
          - strict
          - bounded
          - observational
          title: Replay Mode
          type: string
        request_id:
          maxLength: 200
          minLength: 1
          title: Request Id
          type: string
      required:
      - contract_version
      - request_id
      - correlation_id
      title: RequestContext
      type: object
    ResearchRequest:
      additionalProperties: false
      description: Run bounded research with counterevidence authority.
      properties:
        answer_policy:
          $ref: '#/components/schemas/AnswerPolicy'
        budget:
          $ref: '#/components/schemas/Budget'
        context:
          $ref: '#/components/schemas/RequestContext'
        corpus_id:
          pattern: ^sha256:[0-9a-f]{64}$
          title: Corpus Id
          type: string
        execution_profile:
          enum:
          - offline-lexical
          - local-hybrid-exact
          - local-hybrid-ann
          - qdrant-hybrid
          title: Execution Profile
          type: string
        filters:
          $ref: '#/components/schemas/Filters'
          default:
            document_ids: []
            source_uris: []
        index_id:
          pattern: ^sha256:[0-9a-f]{64}$
          title: Index Id
          type: string
        query:
          maxLength: 32768
          minLength: 1
          title: Query
          type: string
        scope:
          minLength: 1
          title: Scope
          type: string
        top_k:
          maximum: 1000.0
          minimum: 1.0
          title: Top K
          type: integer
      required:
      - context
      - query
      - index_id
      - scope
      - top_k
      - budget
      - execution_profile
      - corpus_id
      - answer_policy
      title: ResearchRequest
      type: object
    RetrieveRequest:
      additionalProperties: false
      description: Retrieve bounded evidence from one index artifact.
      properties:
        budget:
          $ref: '#/components/schemas/Budget'
        context:
          $ref: '#/components/schemas/RequestContext'
        execution_profile:
          enum:
          - offline-lexical
          - local-hybrid-exact
          - local-hybrid-ann
          - qdrant-hybrid
          title: Execution Profile
          type: string
        filters:
          $ref: '#/components/schemas/Filters'
          default:
            document_ids: []
            source_uris: []
        index_id:
          pattern: ^sha256:[0-9a-f]{64}$
          title: Index Id
          type: string
        query:
          maxLength: 32768
          minLength: 1
          title: Query
          type: string
        scope:
          minLength: 1
          title: Scope
          type: string
        top_k:
          maximum: 1000.0
          minimum: 1.0
          title: Top K
          type: integer
      required:
      - context
      - query
      - index_id
      - scope
      - top_k
      - budget
      - execution_profile
      title: RetrieveRequest
      type: object
    RunRequest:
      additionalProperties: false
      description: Submit a complete linked Runtime workflow.
      properties:
        answer_policy:
          $ref: '#/components/schemas/AnswerPolicy'
        budget:
          $ref: '#/components/schemas/Budget'
        context:
          $ref: '#/components/schemas/RequestContext'
        corpus_id:
          anyOf:
          - pattern: ^sha256:[0-9a-f]{64}$
            type: string
          - type: 'null'
          title: Corpus Id
        execution_profile:
          enum:
          - offline-lexical
          - local-hybrid-exact
          - local-hybrid-ann
          - qdrant-hybrid
          title: Execution Profile
          type: string
        filters:
          $ref: '#/components/schemas/Filters'
          default:
            document_ids: []
            source_uris: []
        query:
          maxLength: 32768
          minLength: 1
          title: Query
          type: string
        scope:
          minLength: 1
          title: Scope
          type: string
        source_directory:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Directory
        top_k:
          maximum: 1000.0
          minimum: 1.0
          title: Top K
          type: integer
      required:
      - context
      - query
      - scope
      - top_k
      - answer_policy
      - budget
      - execution_profile
      title: RunRequest
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  contact:
    name: Bijux
    url: https://github.com/bijux/bijux-canon
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  summary: Typed application operations for durable Bijux Canon workflows.
  title: bijux-canon-runtime API
  version: v2
openapi: 3.1.0
paths:
  /api/v2/answers:
    post:
      operationId: ask_api_v2_answers_post
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          maxLength: 200
          minLength: 16
          title: Idempotency-Key
          type: string
      - in: header
        name: Bijux-API-Version
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Bijux-Api-Version
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid typed request.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Resource not found.
        '406':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unsupported API version.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Immutable state conflict.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Application service unavailable.
      summary: Ask
  /api/v2/comparisons:
    post:
      operationId: compare_api_v2_comparisons_post
      parameters:
      - in: header
        name: Bijux-API-Version
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Bijux-Api-Version
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompareRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response Compare Api V2 Comparisons Post
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid typed request.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Resource not found.
        '406':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unsupported API version.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Immutable state conflict.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Application service unavailable.
      summary: Compare
  /api/v2/corpora/prepare:
    post:
      operationId: prepare_corpus_api_v2_corpora_prepare_post
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          maxLength: 200
          minLength: 16
          title: Idempotency-Key
          type: string
      - in: header
        name: Bijux-API-Version
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Bijux-Api-Version
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrepareCorpusRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid typed request.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Resource not found.
        '406':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unsupported API version.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Immutable state conflict.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Application service unavailable.
      summary: Prepare Corpus
  /api/v2/corpora/{corpus_id}:
    get:
      operationId: inspect_corpus_api_v2_corpora__corpus_id__get
      parameters:
      - in: path
        name: corpus_id
        required: true
        schema:
          title: Corpus Id
          type: string
      - in: header
        name: Bijux-API-Version
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Bijux-Api-Version
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusInspectionResponse'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid typed request.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Resource not found.
        '406':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unsupported API version.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Immutable state conflict.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Application service unavailable.
      summary: Inspect Corpus
