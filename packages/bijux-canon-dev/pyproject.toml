[build-system]
requires = ["hatchling>=1.30.1,<1.32", "hatch-vcs>=0.5.0,<1.0"]
build-backend = "hatchling.build"

[project]
name = "bijux-canon-dev"
dynamic = ["version"]
description = "Repository-owned developer tooling for bijux-canon packages."
readme = "README.md"
requires-python = ">=3.11,<4"
license = { text = "Apache-2.0" }
authors = [{ name = "Bijan Mousavi", email = "bijan@bijux.io" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies = [
  "jsonschema[format-nongpl]>=4.23,<5.0",
  "packaging>=24.0,<27.0",
  "PyYAML>=6.0,<7.0",
  "twine>=6.1.0,<7.0",
]

[project.urls]
Homepage = "https://github.com/bijux/bijux-canon/tree/main/packages/bijux-canon-dev"
Repository = "https://github.com/bijux/bijux-canon"
Documentation = "https://bijux.io/bijux-canon/07-bijux-canon-maintain/bijux-canon-dev/"
Issues = "https://github.com/bijux/bijux-canon/issues"
Changelog = "https://github.com/bijux/bijux-canon/blob/main/packages/bijux-canon-dev/CHANGELOG.md"
Security = "https://github.com/bijux/bijux-canon/blob/main/SECURITY.md"

[project.scripts]
bijux-canon-extras-matrix = "bijux_canon_dev.release.extras_matrix:main"
bijux-canon-family-compatibility = "bijux_canon_dev.release.family_compatibility:main"
bijux-canon-installation-matrix = "bijux_canon_dev.release.installation_matrix:main"
bijux-canon-python-support = "bijux_canon_dev.release.python_support_matrix:main"
bijux-canon-release-candidate = "bijux_canon_dev.release.release_candidate_identity:main"
bijux-canon-supply-chain = "bijux_canon_dev.sbom.supply_chain:main"
bijux-canon-wheel-inventory = "bijux_canon_dev.release.wheel_inventory:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=1.0.0,<2.0",
  "pytest-cov>=6.2.1,<8.0",
  "pytest-timeout>=2.4.0,<3.0",
  "hatch>=1.14.0,<2.0",
  "pydantic>=2.12,<3.0",
  "ruff>=0.6.8,<1.0",
  "mypy>=1.11.2,<3.0",
  "types-PyYAML>=6.0.12.20250822,<7.0",
  "types-jsonschema>=4.23,<5.0",
  "vulture>=2.7,<3.0",
  "deptry>=0.10.0,<1.0",
  "interrogate>=1.7.0,<2.0",
  "bandit>=1.7.10,<2.0",
  "pip-audit>=2.7.3,<3.0",
  "build>=1.0.3,<2.0",
  "codespell>=2.3.0,<3.0",
  "pydocstyle>=6.3.0,<7.0",
  "mkdocs>=1.6.1,<2.0",
  "mkdocs-material>=9.5.39,<10.0",
  "mkdocs-autorefs>=1.4.4,<2.0",
  "mkdocs-redirects>=1.2,<2.0",
  "mkdocs-git-revision-date-localized-plugin>=1.2.0,<2.0",
  "pymdown-extensions>=11.0.1,<12.0",
]

[tool.hatch.version]
source = "vcs"
tag-pattern = "^v(?P<version>.*)$"
raw-options = { git_describe_command = "git describe --dirty --tags --long --match 'v*'", local_scheme = "dirty-tag", version_scheme = "guess-next-dev", root = "../..", search_parent_directories = true }
fallback-version = "0.4.0"

[tool.pytest.ini_options]
markers = [
  "slow: long-running checks excluded from default ci and tox lanes",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bijux_canon_dev"]
include = ["src/bijux_canon_dev/py.typed"]

[tool.hatch.build.targets.wheel.package-data]
"bijux_canon_dev" = ["py.typed"]

[tool.hatch.build]
include = [
  "CHANGELOG.md",
  "README.md",
  "src/bijux_canon_dev/**",
]
